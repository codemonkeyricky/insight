packages:
  - "packages/*"
  - "packages/core/*"
  - "packages/lens/*"
  - "packages/frontend/*"
  - "apps/*"
minimumReleaseAgeExclude:
  - web-tree-sitter@0.27.2
allowBuilds:
  tree-sitter-c: false
  tree-sitter-cpp: false
# Transitive d3 packages whose latest releases are less than two weeks old. Pinned to the
# last releases before that window; drop these once the d3 dependency tree settles.
overrides:
  d3-dispatch: 3.0.1
  d3-timer: 3.0.1
  d3-ease: 3.0.1
  d3-color: 3.1.0
  # light-my-request >=6.8 depends on cookie@2 (ESM-only); the Vercel Node runtime cannot
  # require() it. 6.6.0 is the newest 6.x still on cookie@^1 (CJS). Drop once fastify/cookie move.
  light-my-request: 6.6.0
