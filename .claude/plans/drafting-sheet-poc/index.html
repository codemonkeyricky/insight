<meta charset="utf-8">
<title>Insight Drafting Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Layout: canvas-first drafting sheet. 44px top bar, the map fills the rest; title block, layers and detail views live on the sheet; source slides over from the right. */
:root {
  --film: #ECEFEE;       /* drafting film: the sheet ground */
  --sheet: #F8F9F8;      /* raised surfaces: boxes, panels */
  --ink: #17212B;        /* india ink: text, process lines */
  --graphite: #5B6772;   /* secondary text, thin construction lines */
  --rule: #C3CCCF;       /* zone grid, borders */
  --faint: #DCE2E3;      /* hairlines, row separators */
  --accent: #1E5A96;     /* prussian blue: selection, detail callouts */
  --thread: #2A7360;     /* verdigris: thread frames */
  --coroutine: #8C5C10;  /* ochre: coroutine frames, await */
  --red: #B2263A;        /* red pencil: findings, revision clouds */
  --shadow: rgba(23, 33, 43, 0.14);
  --glass: rgba(248, 249, 248, 0.86);

  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-code: "Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs: 11.5px; --t-sm: 13px; --t-md: 15px; --t-lg: 18px; --t-xl: 23px;

  --bar-h: 46px;
  --m: 22px;            /* sheet margin holding the zone references */
  --panel-w: 0px;       /* set while the source panel is open */
  --sheet-h: 0px;       /* set while the phone bottom sheet is open */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --film: #121820; --sheet: #1A222B; --ink: #DCE4E9; --graphite: #93A1AC; --rule: #34404A; --faint: #26303A;
    --accent: #7FB0E0; --thread: #6CC2A8; --coroutine: #DDA94F; --red: #F27A8A;
    --shadow: rgba(0, 0, 0, 0.45); --glass: rgba(26, 34, 43, 0.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --film: #121820; --sheet: #1A222B; --ink: #DCE4E9; --graphite: #93A1AC; --rule: #34404A; --faint: #26303A;
  --accent: #7FB0E0; --thread: #6CC2A8; --coroutine: #DDA94F; --red: #F27A8A;
  --shadow: rgba(0, 0, 0, 0.45); --glass: rgba(26, 34, 43, 0.86);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--film); color: var(--ink);
  font: 400 var(--t-md)/1.4 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }

/* Top bar */
.bar {
  display: flex; align-items: center; gap: 18px; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); border-bottom: 1px solid var(--rule); position: relative; z-index: 5;
}
.mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--t-lg); letter-spacing: -0.01em; }
.mark svg { flex: none; }
.crumbs { display: flex; align-items: baseline; gap: 2px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: var(--t-md); }
.crumbs button { background: none; border: 0; padding: 4px 3px; border-radius: 4px; cursor: pointer; color: var(--graphite); }
.crumbs button:hover { color: var(--ink); background: var(--faint); }
.crumbs button[aria-current] { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--rule); }
.modes { display: flex; border: 1px solid var(--rule); border-radius: 7px; padding: 2px; gap: 2px; flex: none; }
.modes button { border: 0; background: none; padding: 4px 12px; border-radius: 5px; cursor: pointer; font-weight: 500; color: var(--graphite); display: flex; gap: 6px; align-items: baseline; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.modes button:active { transform: scale(0.97); }
.modes .n { font-size: var(--t-xs); font-variant-numeric: tabular-nums; opacity: 0.8; }
.spacer { flex: 1; }
.tools { display: flex; gap: 6px; flex: none; }
.tool { border: 1px solid var(--rule); background: var(--sheet); border-radius: 7px; padding: 4px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tool:hover { border-color: var(--graphite); }
.tool:active { transform: scale(0.97); }
.tool kbd { font: 500 var(--t-xs) var(--font-code); color: var(--graphite); }
.tool.notes { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* Stage */
.stage { position: relative; min-height: 0; overflow: hidden; }
#map, #frame { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
#frame { pointer-events: none; }
.frame-line { stroke: var(--ink); fill: none; }
.frame-tick { stroke: var(--graphite); stroke-width: 1; }
.frame-label { fill: var(--graphite); font: 500 11px var(--font-ui); text-anchor: middle; dominant-baseline: central; }

/* World drawing */
.zone-box { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.zone-name { fill: var(--ink); font: 600 46px var(--font-ui); letter-spacing: -0.01em; }
.zone-sub { fill: var(--graphite); font: 400 20px var(--font-ui); }
.zone-hit { fill: transparent; cursor: pointer; }
.zone-dots { fill: var(--graphite); opacity: 0.35; }
.zone-note { fill: var(--graphite); font: italic 400 17px var(--font-ui); }
.bundle { fill: none; stroke: var(--graphite); stroke-opacity: 0.35; }
.bundle-label { fill: var(--graphite); font: 500 22px var(--font-ui); }

.rt-frame { fill: none; }
.rt-thread { stroke: var(--thread); stroke-width: 1.6; }
.rt-process { stroke: var(--ink); stroke-width: 3.2; }
.rt-coroutine { stroke: var(--coroutine); stroke-width: 1.6; stroke-dasharray: 9 6; }
.rt-label { font: 600 15px var(--font-ui); }
.rt-label.thread { fill: var(--thread); }
.rt-label.process { fill: var(--ink); }
.rt-sub { fill: var(--graphite); font: 400 13px var(--font-ui); }

.call { fill: none; stroke: var(--graphite); stroke-opacity: 0.42; stroke-width: 1; }
.call.hot { stroke: var(--accent); stroke-opacity: 1; stroke-width: 1.8; }
.fn { cursor: pointer; }
.fn rect { fill: var(--sheet); stroke: var(--ink); stroke-width: 0.9; transition: fill 120ms ease-out; }
.fn.thread rect { stroke: var(--thread); }
.fn text { fill: var(--ink); font: 500 12.5px var(--font-ui); pointer-events: none; }
.fn:hover rect { fill: var(--faint); }
.fn.pressed rect { fill: var(--rule); }
.fn.sel rect { stroke: var(--accent); stroke-width: 2; }
.fn:focus-visible { outline: none; }
.fn:focus-visible rect { stroke: var(--accent); stroke-width: 2.4; }
.fn.dim { opacity: 0.22; }
.call.dim { opacity: 0.15; }
.far .fn text { display: none; }
.far .fn rect { fill: var(--graphite); stroke: none; opacity: 0.55; }
.far .fn.thread rect { fill: var(--thread); }
.far .call { stroke-opacity: 0.18; }
.far .rt-sub { display: none; }
.off-calls .call { display: none; }
.off-rt .rt-frame, .off-rt .rt-label, .off-rt .rt-sub { display: none; }

.cloud { fill: none; stroke: var(--red); stroke-width: 1.3; stroke-linejoin: round; }
.rev polygon { fill: var(--sheet); stroke: var(--red); stroke-width: 1.2; }
.rev text { fill: var(--red); font: 700 9.5px var(--font-ui); text-anchor: middle; dominant-baseline: central; }

/* Detail view */
.callout-circle { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.leader { fill: none; stroke: var(--accent); stroke-width: 1.1; }
.bubble circle { fill: var(--sheet); stroke: var(--accent); stroke-width: 1.5; }
.bubble text { fill: var(--accent); font: 700 15px var(--font-ui); text-anchor: middle; dominant-baseline: central; }
.detail-bg { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.4; filter: drop-shadow(0 6px 14px var(--shadow)); }
.detail-title { fill: var(--ink); font: 600 17px var(--font-ui); }
.detail-sub { fill: var(--graphite); font: 400 11.5px var(--font-code); }
.detail-scale { fill: var(--graphite); font: 500 11.5px var(--font-ui); }
.cfg-node { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
.cfg-node.await { stroke: var(--coroutine); stroke-dasharray: 6 4; }
.cfg-node.marker { stroke-dasharray: 3 3; stroke: var(--graphite); }
.cfg-join { fill: var(--ink); }
.cfg-text { fill: var(--ink); font: 500 15px var(--font-ui); text-anchor: middle; dominant-baseline: central; }
.cfg-text.code { font: 400 14px var(--font-code); }
.cfg-edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.cfg-edge.back { stroke: var(--graphite); stroke-dasharray: 5 4; }
.cfg-edge.exception { stroke: var(--red); stroke-dasharray: 6 4; }
.cfg-tag { fill: var(--graphite); font: 500 12px var(--font-ui); }
.arrow { fill: var(--ink); }
.arrow-g { fill: var(--graphite); }
.arrow-a { fill: var(--accent); }
.arrow-r { fill: var(--red); }

/* Arch */
.arch-box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2; }
.arch-node { cursor: pointer; }
.arch-node:hover .arch-box { stroke: var(--accent); stroke-width: 2; }
.arch-name { fill: var(--ink); font: 600 23px var(--font-ui); }
.arch-sub { fill: var(--graphite); font: 400 16px var(--font-ui); }
.arch-edge { fill: none; stroke: var(--graphite); stroke-opacity: 0.55; }
.arch-edge.hot { stroke: var(--accent); stroke-opacity: 1; }
.arch-count { fill: var(--graphite); font: 600 15px var(--font-ui); text-anchor: middle; dominant-baseline: central; }
.arch-count-bg { fill: var(--film); }
.arch-layer { fill: var(--graphite); font: 500 17px var(--font-ui); }

/* Title block */
.titleblock {
  position: absolute; z-index: 3; right: calc(var(--m) + var(--panel-w)); bottom: calc(var(--m) + var(--sheet-h));
  display: grid; grid-template-columns: auto auto auto; background: var(--sheet);
  border: 1.5px solid var(--ink); font-size: var(--t-sm); max-width: calc(100% - 2 * var(--m));
  transition: right 380ms cubic-bezier(.2,.8,.2,1);
}
.titleblock > div { padding: 5px 10px 6px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); min-width: 0; }
.titleblock > div:nth-child(3n) { border-right: 0; }
.titleblock > div.last { border-bottom: 0; }
.titleblock .k { color: var(--graphite); font-size: var(--t-xs); line-height: 1.1; }
.titleblock .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titleblock .wide { grid-column: span 2; }
.titleblock .proj .v { font-size: var(--t-lg); font-weight: 700; letter-spacing: -0.01em; }
.titleblock .v .code { font: 500 12px var(--font-code); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--thread); margin-right: 6px; vertical-align: 1px; }

/* Layers */
.layers {
  position: absolute; z-index: 3; left: var(--m); bottom: calc(var(--m) + var(--sheet-h));
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; width: 236px; font-size: var(--t-sm);
  box-shadow: 0 2px 8px var(--shadow);
}
.layers > button { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: var(--t-md); }
.layers > button .chev { transition: transform 200ms ease-out; color: var(--graphite); }
.layers[data-open="false"] > button .chev { transform: rotate(180deg); }
.layers[data-open="false"] .layer-list { display: none; }
.layer-list { padding: 2px 6px 8px; display: grid; gap: 1px; }
.layer { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.layer:hover { background: var(--faint); }
.layer input { margin: 0; accent-color: var(--accent); }
.layer .cnt { display: flex; align-items: center; gap: 4px; color: var(--red); font-weight: 600; font-variant-numeric: tabular-nums; }
.layer.none { color: var(--graphite); cursor: default; }
.layer.none:hover { background: none; }
.layer.none .cnt { color: var(--graphite); font-weight: 400; }
.layer-sep { border-top: 1px solid var(--faint); margin: 5px 6px; }
.legend { display: grid; grid-template-columns: 38px 1fr; gap: 3px 8px; align-items: center; padding: 2px 8px 0 32px; color: var(--graphite); font-size: var(--t-xs); }

/* Side panel (source) */
.panel {
  position: absolute; z-index: 4; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0;
  transform: translateX(100%); visibility: hidden;
}
.panel.open { transform: none; visibility: visible; }
.panel-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--faint); display: grid; gap: 6px; }
.panel-head .row { display: flex; align-items: flex-start; gap: 10px; }
.panel h2 { margin: 0; font-size: var(--t-xl); line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; min-width: 0; overflow-wrap: anywhere; flex: 1; text-wrap: balance; }
.close { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; flex: none; display: grid; place-items: center; }
.close:active { transform: scale(0.95); }
.where { font: 400 12.5px var(--font-code); color: var(--graphite); display: flex; gap: 12px; flex-wrap: wrap; }
.where b { font-weight: 500; color: var(--ink); }
.runtime { display: flex; gap: 8px; align-items: center; font-size: var(--t-sm); color: var(--graphite); }
.panel-body { overflow: auto; flex: 1; min-height: 0; padding: 12px 18px 24px; display: grid; gap: 16px; align-content: start; }
.panel h3 { margin: 0 0 6px; font-size: var(--t-sm); font-weight: 600; color: var(--graphite); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--rule); background: var(--sheet); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: var(--t-sm); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:active { transform: scale(0.97); }
.empty-note { color: var(--graphite); font-size: var(--t-sm); }
.finds { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: var(--t-sm); }
.finds li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; }
.code {
  margin: 0; font: 400 12.5px/1.6 var(--font-code); background: var(--sheet); border: 1px solid var(--faint);
  border-radius: 6px; overflow: auto; padding: 8px 0; tab-size: 2;
}
.code .ln { display: grid; grid-template-columns: 46px 1fr; }
.code .ln span:first-child { color: var(--graphite); text-align: right; padding-right: 12px; user-select: none; opacity: 0.8; }
.code .ln span:last-child { white-space: pre; padding-right: 12px; }

/* Findings mode */
.findings { position: absolute; inset: 0; overflow: auto; z-index: 2; background: var(--film); }
.findings-inner {
  max-width: 1080px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.findings h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 4px; text-wrap: balance; }
.findings .lede { color: var(--graphite); margin: 0 0 22px; max-width: 64ch; }
.revtable { border: 1.5px solid var(--ink); background: var(--sheet); }
.revhead, .revrow > .summary { display: grid; grid-template-columns: 52px minmax(0, 1.5fr) 90px minmax(0, 1.3fr) 128px; }
.revhead > div { padding: 6px 12px; font-size: var(--t-xs); color: var(--graphite); border-right: 1px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.revhead > div:last-child, .revrow .summary > div:last-child { border-right: 0; }
.revrow { border-bottom: 1px solid var(--ink); }
.revrow:last-child { border-bottom: 0; }
.revrow .summary > div { padding: 12px; border-right: 1px solid var(--faint); min-width: 0; }
.revrow .msg { font-size: var(--t-lg); font-weight: 600; line-height: 1.2; }
.revrow .lens { color: var(--graphite); font-size: var(--t-sm); margin-top: 2px; }
.revrow .count { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.bars { display: grid; gap: 3px; font-size: var(--t-xs); }
.bars .b { display: grid; grid-template-columns: minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
.bars .b > span:first-child { position: relative; font-family: var(--font-code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 4px; }
.bars .b i { position: absolute; inset: 0 auto 0 0; background: var(--red); opacity: 0.13; border-radius: 2px; }
.bars .b > span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--graphite); }
.revrow .acts { display: grid; gap: 6px; align-content: start; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-align: left; font-size: var(--t-sm); }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.examples { padding: 4px 12px 14px 64px; display: none; font-size: var(--t-sm); }
.revrow.open .examples { display: block; }
.examples ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.examples li { display: flex; gap: 12px; flex-wrap: wrap; }
.examples code { font: 400 12px var(--font-code); color: var(--graphite); }

/* Notes drawer */
.notes-drawer {
  position: absolute; z-index: 6; top: 0; left: 0; bottom: 0; width: min(500px, 100%);
  background: var(--sheet); border-right: 1px solid var(--rule); box-shadow: 8px 0 30px var(--shadow);
  overflow: auto; transform: translateX(-102%); visibility: hidden;
}
.notes-drawer.open { transform: none; visibility: visible; }
.notes-inner { padding-block: 22px 60px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: 22px; display: grid; gap: 14px; }
.notes-drawer h1 { font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.notes-drawer h2 { font-size: var(--t-xl); line-height: 1.15; letter-spacing: -0.01em; margin: 14px 0 0; text-wrap: balance; }
.notes-drawer p, .notes-drawer li { line-height: 1.5; max-width: 62ch; }
.notes-drawer p { margin: 0; }
.notes-drawer ul, .notes-drawer ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.notes-drawer .muted { color: var(--graphite); }
.notes-drawer figure { margin: 0; border: 1px solid var(--rule); background: var(--film); }
.notes-drawer figure img { display: block; width: 100%; height: auto; }
.notes-drawer figcaption { padding: 6px 10px; font-size: var(--t-sm); color: var(--graphite); border-top: 1px solid var(--rule); }
.swap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); border: 1.5px solid var(--ink); font-size: var(--t-sm); }
.swap > div { padding: 7px 10px; border-bottom: 1px solid var(--faint); min-width: 0; }
.swap > div:nth-child(odd) { color: var(--graphite); border-right: 1px solid var(--ink); }
.swap > .h { font-size: var(--t-xs); border-bottom: 1.5px solid var(--ink); font-weight: 600; color: var(--graphite); }
.notes-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

/* Find palette */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, 0.32); display: grid; justify-items: center; align-items: start; padding-top: 12vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scrim[hidden] { display: none !important; }
.palette { width: min(560px, 100%); background: var(--sheet); border: 1.5px solid var(--ink); box-shadow: 0 20px 50px var(--shadow); transform-origin: 50% 0; }
.palette input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px; font: 500 var(--t-lg) var(--font-ui); background: transparent; color: var(--ink); outline: none; }
.results { max-height: 50vh; overflow: auto; padding: 6px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 7px 10px; border-radius: 5px; cursor: pointer; align-items: baseline; }
.res[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.res[aria-selected="true"] small { color: inherit; opacity: 0.75; }
.res small { color: var(--graphite); font: 400 12px var(--font-code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.res .group { font-size: var(--t-xs); }
.res-h { padding: 8px 10px 3px; font-size: var(--t-xs); color: var(--graphite); font-weight: 600; }
.palette-foot { border-top: 1px solid var(--rule); padding: 7px 14px; font-size: var(--t-xs); color: var(--graphite); display: flex; gap: 14px; flex-wrap: wrap; }
.palette-foot kbd { font: 500 11px var(--font-code); }

/* Files drawer */
.files {

<script>
(() => {

const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const store = { get(k, d) { try { const v = localStorage.getItem("insight-sheet:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("insight-sheet:" + k, JSON.stringify(v)); } catch {} } };

/* ---------- springs (critically damped by default, interruptible) ---------- */
class Spring {
  constructor(v, response = 0.45) { this.v = v; this.t = v; this.vel = 0; this.response = response; }

    if (Math.abs(this.v - this.t) < this.eps && Math.abs(this.vel) < this.eps * 4) { this.v = this.t; this.vel = 0; return false; }
    return true;
  }

Spring.prototype.eps = 0.002;
const anims = new Set(); let raf = 0, lastT = 0, camDirty = false;

  if (camDirty) { camDirty = false; applyCam(); }

/* ---------- state ---------- */
const S = { mode: "map", scope: "src", focus: null, sel: null, layers: store.get("layers", { runtime: true, calls: true, "lens-flow-complexity": true }), letters: {}, nextLetter: 0, notesOpen: store.get("notesOpen", true) };
let D = null, D2 = {}, FN = new Map(), CALLERS = new Map(), ZONES = {}, ZG = {}, ARCH = null, BOUNDS = null;
const stage = $("#stage"), svg = $("#map"), world = $("#world"), frame = $("#frame");
let W = 0, H = 0;
const cam = { wx: new Spring(0), wy: new Spring(0), lk: new Spring(0) };
cam.wx.eps = 0.05; cam.wy.eps = 0.05; cam.lk.eps = 0.0008;
const K = () => Math.exp(cam.lk.v);

/* ---------- layout constants ---------- */
const FW = 178, FH = 24, COL = 252, ROW = 34, GZ = 480, GX0 = -160, GY0 = -160;
const gridRef = (x, y) => { const c = Math.floor((x - GX0) / GZ), r = Math.floor((y - GY0) / GZ) + 1; return (c >= 0 && c < 26 ? String.fromCharCode(65 + c) : "?") + r; };

/* ---------- data ---------- */
Promise.all([
  fetch("data.json").then((r) => { if (!r.ok) throw new Error("data.json " + r.status); return r.json(); }),
  fetch("data2.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
]).then(([a, b]) => { D = a; D2 = b || {}; boot(); }).catch((e) => {
  $("#loading").textContent = "The sheet data did not load (" + e.message + "). Reload the page to try again.";
});

function boot() {
  $("#loading").remove();
  for (const f of D.scope.functions) FN.set(f.id, { ...f, calls: f.calls.filter((c) => c !== f.id) });
  for (const f of FN.values()) f.calls = f.calls.filter((c) => FN.has(c));
  for (const f of FN.values()) for (const c of f.calls) { if (!CALLERS.has(c)) CALLERS.set(c, []); CALLERS.get(c).push(f.id); }
  D.cfgAll = Object.assign({}, D2.cfg || {}, D.cfg || {});
  D.srcAll = Object.assign({}, D.source || {}, D2.source || {});
  $("#m-findings-n").textContent = fmt(D.project.findings);
  layoutMap(); drawMap(); buildLayers(); buildFiles(); buildNotes(); buildFindings();
  resize();
  const start = "src/App.tsx#App.doGearedTail";
  setScope("src", { instant: true });
  if (FN.has(start)) select(start, { instant: true });
  setNotes(S.notesOpen, true);
}

/* ---------- map layout ---------- */
function layoutMap() {
  const fns = [...FN.values()];
  const depth = new Map(fns.map((f) => [f.id, 0]));
  for (let it = 0; it < fns.length; it++) {
    let changed = false;
    for (const f of fns) for (const c of f.calls) { const d = depth.get(f.id) + 1; if (d > depth.get(c) && d < 9) { depth.set(c, d); changed = true; } }
    if (!changed) break;
  }
  const maxCol = Math.max(...depth.values());
  const bands = { thread: fns.filter((f) => f.runtime === "thread"), none: fns.filter((f) => f.runtime !== "thread") };
  const rowOf = new Map();
  const place = (list) => {
    const cols = [];
    for (let c = 0; c <= maxCol; c++) {
      const inCol = list.filter((f) => depth.get(f.id) === c);
      const bary = (f) => { const cs = (CALLERS.get(f.id) || []).filter((p) => rowOf.has(p)); return cs.length ? cs.reduce((s, p) => s + rowOf.get(p), 0) / cs.length : 1e3 + f.name.charCodeAt(0); };
      inCol.sort((a, b) => bary(a) - bary(b) || a.name.localeCompare(b.name));
      inCol.forEach((f, i) => rowOf.set(f.id, i));
      cols.push(inCol);
    }
    return cols;
  };
  const PAD = 60, TOP = 150;
  const tCols = place(bands.thread), nCols = place(bands.none);
  const tRows = Math.max(...tCols.map((c) => c.length)), nRows = Math.max(...nCols.map((c) => c.length));
  const tMin = tCols.findIndex((c) => c.length), tMax = tCols.length - 1 - [...tCols].reverse().findIndex((c) => c.length);
  const tFrame = { x: PAD + tMin * COL - 22, y: TOP, w: (tMax - tMin) * COL + FW + 44, h: tRows * ROW + 66 };
  tCols.forEach((col, c) => col.forEach((f, i) => Object.assign(FN.get(f.id), { x: PAD + c * COL, y: TOP + 48 + i * ROW })));
  const nTop = TOP + tFrame.h + 70;
  nCols.forEach((col, c) => col.forEach((f, i) => Object.assign(FN.get(f.id), { x: PAD + c * COL, y: nTop + i * ROW })));
  const srcW = PAD * 2 + maxCol * COL + FW, srcH = nTop + nRows * ROW + 60;
  const tree = Object.fromEntries(D.tree.map((t) => [t.path, t]));
  const gap = 200, rx = srcW + gap;
  ZONES = {
    src: { x: 0, y: 0, w: srcW, h: srcH, t: tree.src },
    scripts: { x: rx, y: 0, w: 820, h: 760, t: tree.scripts },
    parts: { x: rx, y: 860, w: 470, h: 330, t: tree.parts },
    samples: { x: rx + 520, y: 860, w: 300, h: 150, t: tree.samples },
    ".claude": { x: rx + 520, y: 1060, w: 300, h: 130, t: tree[".claude"] },
  };
  ZONES.src.thread = { ...tFrame, count: (D.exec.containers.find((c) => c.id === "main") || {}).functions || 0, shown: bands.thread.length };
  const minX = -120, minY = -120, maxX = rx + 820 + 120, maxY = Math.max(srcH, 1190) + 120;
  BOUNDS = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function cloudPath(x, y, w, hgt, r) {
  const p = 7; x -= p; y -= p; w += 2 * p; hgt += 2 * p;
  const pts = [], edge = (x1, y1, x2, y2) => { const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(len / (2 * r))); for (let i = 0; i < n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]); };

let G = {};
function drawMap() {

    if (key === "src") svgEl("text", { class: "zone-note", x: z.x + 30, y: z.y + 122 }, g).textContent = `The ${FN.size} most-connected of ${pal(t.functions)} functions are drawn in this prototype.`;
    if (key === "scripts") {

      svgEl("text", { class: "zone-note", x: z.x + 30, y: z.y + 462 }, g).textContent = "1,281 functions. Prototype data covers src only, so they are drawn as marks.";

  }

  G.threadRect = svgEl("rect", { class: "rt-frame rt-thread", x: th.x, y: th.y, width: th.w, height: th.h }, G.rt);
  G.srcRects = [...ZG.src.querySelectorAll("rect")];

  svgEl("text", { class: "rt-sub", x: th.x + 110, y: th.y + 26 }, G.rt).textContent = `${th.shown} of ${th.count} functions that run on it`;
  const nt = Math.min(...[...FN.values()].filter((f) => f.runtime !== "thread").map((f) => f.y));
  svgEl("text", { class: "rt-sub", x: 60, y: nt - 18 }, G.rt).textContent = "Plain code flow: called from module code, with no runtime context of its own";

    G.bundle = svgEl("g", {}, G.zones);
    svgEl("path", { class: "bundle", d: `M${a.x} ${y1} C${a.x - 90} ${y1}, ${b.x + b.w + 90} ${y2}, ${b.x + b.w + 6} ${y2}`, "stroke-width": 14, "marker-end": "url(#ahb)" }, G.bundle);

    const g = svgEl("g", { class: "fn" + (f.runtime === "thread" ? " thread" : ""), "data-fn": f.id, tabindex: "0", role: "button", "aria-label": `${f.name}, ${f.file} line ${f.line}` }, G.fns);
    svgEl("rect", { x: f.x, y: f.y, width: FW, height: FH, rx: 2 }, g);
    const label = f.name.length > 25 ? f.name.slice(0, 24) + "…" : f.name;
    svgEl("text", { x: f.x + 8, y: f.y + 16.5 }, g).textContent = label;
  }
  drawClouds();
}
